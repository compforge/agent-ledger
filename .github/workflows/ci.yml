name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ledger
          POSTGRES_USER: ledger
          POSTGRES_DB: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ledger
          MYSQL_DATABASE: ledger
          MYSQL_USER: ledger
          MYSQL_PASSWORD: ledger
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AGENT_LEDGER_REDIS_URL: redis://localhost:6379/0
      AGENT_LEDGER_POSTGRES_URL: postgresql+asyncpg://ledger:ledger@localhost:5432/ledger
      AGENT_LEDGER_MYSQL_URL: mysql+asyncmy://ledger:ledger@localhost:3306/ledger
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras
      - run: make lint
      - run: make test

